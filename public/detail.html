<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ops Agent Detail</title>
<style>
:root{font-family:Arial,sans-serif;color:#111827;background:#f4f5f7}
*{box-sizing:border-box}body{margin:0}
header{background:#111827;color:white;padding:16px 20px}
.header{max-width:980px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
header a{color:white;text-decoration:none;border:1px solid #374151;border-radius:8px;padding:7px 9px;font-size:12px}
main{max-width:980px;margin:18px auto;padding:0 14px 30px}
.hero,.panel{background:white;border:1px solid #e5e7eb;border-radius:12px;padding:15px;margin-bottom:12px}
.hero h1{font-size:22px;margin:0 0 5px}.muted{font-size:12px;color:#6b7280}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel h2{font-size:15px;margin:0 0 10px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:7px;font-size:13px;margin:5px 0}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:11px;font-weight:700}
.timeline{border-left:2px solid #e5e7eb;margin-left:7px;padding-left:15px}
.event{margin:0 0 15px}.event strong{display:block;font-size:13px}.event span{font-size:11px;color:#6b7280}
.card{border:1px solid #e5e7eb;border-radius:9px;padding:10px;margin:7px 0}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;background:#f9fafb;padding:10px;border-radius:8px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.kv{grid-template-columns:110px 1fr}.header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div class="header"><div><strong>Ops Agent — Detail</strong><div class="muted" style="color:#cbd5e1">Demo/shadow mode</div></div><a href="/">← Command Center</a></div></header>
<main id="content"></main>
<script src="/detail.js"></script>
</body>
</html>
